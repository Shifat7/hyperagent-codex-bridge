name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  real-codex:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @openai/codex@0.144.6
      - run: node --test
        env:
          CODEX_BIN: codex
      - run: node scripts/verify-release.mjs
        env:
          CODEX_BIN: codex
